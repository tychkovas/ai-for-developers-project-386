name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test (vitest + smoke)
        run: npm run test

      - name: "OpenAPI: freshness (docs/openapi.yaml == make openapi)"
        run: make openapi && git diff --exit-code docs/openapi.yaml
